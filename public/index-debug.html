<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickQuote - Debug Version</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    #error-container {
      color: red;
      margin-top: 20px;
      padding: 10px;
      border: 1px solid red;
      border-radius: 4px;
      display: none;
    }
    #loading-indicator {
      margin-top: 20px;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container mt-4">
    <div class="row">
      <div class="col-12">
        <h1>QuickQuote - Debug Version</h1>
        <p>This page includes error handling to help diagnose issues.</p>
        <div id="loading-indicator">
          <p>Loading application...</p>
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div id="error-container"></div>
        <div id="root"></div>
      </div>
    </div>
  </div>

  <script>
    // Error handling for script loading
    window.onerror = function(message, source, lineno, colno, error) {
      const errorContainer = document.getElementById('error-container');
      const loadingIndicator = document.getElementById('loading-indicator');
      
      errorContainer.style.display = 'block';
      loadingIndicator.style.display = 'none';
      
      errorContainer.innerHTML = `<strong>Error loading application:</strong><br>${message}<br>Source: ${source}<br>Line: ${lineno}, Column: ${colno}`;
      console.error('Error loading application:', message, source, lineno, colno, error);
      return true;
    };

    // Add a timeout to check if the app has loaded
    setTimeout(function() {
      const root = document.getElementById('root');
      const loadingIndicator = document.getElementById('loading-indicator');
      const errorContainer = document.getElementById('error-container');
      
      if (root.children.length === 0) {
        errorContainer.style.display = 'block';
        loadingIndicator.style.display = 'none';
        errorContainer.innerHTML = '<strong>Application did not load:</strong><br>The React application did not render any content within 5 seconds.';
        console.error('Application did not load: The React application did not render any content within 5 seconds.');
      } else {
        loadingIndicator.style.display = 'none';
      }
    }, 5000);
  </script>
</body>
</html>
